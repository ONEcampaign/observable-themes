name: Publish to npm

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for npm trusted publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # bundles npm >= 11.5.1, required for trusted publishing
          registry-url: https://registry.npmjs.org/

      - run: npm ci

      - name: Check if version changed
        id: version-check
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          NPM=$(npm view $(node -p "require('./package.json').name") version 2>/dev/null || echo "0.0.0")
          if [ "$LOCAL" = "$NPM" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish
        if: steps.version-check.outputs.skip == 'false'
        # verbose: npm logs trusted-publishing (OIDC) exchange failures only at this level
        run: npm publish --access public --loglevel verbose
